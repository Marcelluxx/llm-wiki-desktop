[workspace]
members = ["apps/desktop/src-tauri", "crates/app-core"]
resolver = "2"

[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.98.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "sync", "time"] }
